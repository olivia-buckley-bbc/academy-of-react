    <script>
      // TODO: Create a wizard object with properties:

      // - specialty
      // (Add more properties as needed)


const wizard = {
  name: "Olivia Buckley",
  house: "Scarybird",
  magicLevel: 45,
  health: 100,
};

      // TODO: Create React elements using React.createElement()
      // to display the wizard's information

const myWizardCard = React.createElement(
  "div",
  null,
  React.createElement("h2", null, wizard.name),
  React.createElement("p", null, `House: ${wizard.house}`),
  React.createElement(
    "div",
    null,
    React.createElement("p", null, `Magic Level: ${wizard.magicLevel}`)
    ,
  ),
  React.createElement(
    "div",
    null,
    React.createElement("p", null, `Health: ${wizard.health}`),
  
  )
);
      // TODO: Render your React elements

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(
        // Your React elements go here
myWizardCard       
      );
